name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            if [[ -z "$latest_tag" ]]; then
              latest_tag="v0.0.0"
            fi
            IFS='.' read -r major minor patch <<< "${latest_tag#v}"
            release_tag="v${major}.$((minor + 1)).0"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Release version: $release_tag"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Package static site
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: zip -r "sports-scoreboard-${RELEASE_TAG}.zip" dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            "sports-scoreboard-${RELEASE_TAG}.zip" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "Sports Scoreboard ${RELEASE_TAG}"
