name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            if [[ -z "$latest_tag" ]]; then
              latest_tag="v0.0.0"
            fi
            IFS='.' read -r major minor patch <<< "${latest_tag#v}"
            release_tag="v${major}.$((minor + 1)).0"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Release version: $release_tag"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Package static site
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: zip -r "sports-scoreboard-${RELEASE_TAG}.zip" dist/

      - name: Create GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; continuing with wrapper dispatch."
          else
            gh release create "$RELEASE_TAG" \
              "sports-scoreboard-${RELEASE_TAG}.zip" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "Sports Scoreboard ${RELEASE_TAG}"
          fi
              release_metadata=$(gh release view "$RELEASE_TAG" --json databaseId,url)
              echo "release_id=$(jq -r '.databaseId' <<< "$release_metadata")" >> "$GITHUB_OUTPUT"
              echo "release_url=$(jq -r '.url' <<< "$release_metadata")" >> "$GITHUB_OUTPUT"

      - name: Create wrapper dispatch token
        id: wrapper-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.NATIVE_WRAPPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.NATIVE_WRAPPER_APP_PRIVATE_KEY }}
          owner: RyanMorrisroe
          repositories: SportsScoreboard-Native
          permission-contents: write

      - name: Dispatch published SPA release to wrapper
        env:
          GH_TOKEN: ${{ steps.wrapper-token.outputs.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
        run: |
          payload=$(jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg version "${RELEASE_TAG#v}" \
            --arg sha "$RELEASE_SHA" \
            --arg release_id "$RELEASE_ID" \
            --arg release_url "$RELEASE_URL" \
            '{event_type:"sports-scoreboard-release",client_payload:{tag:$tag,version:$version,sha:$sha,release_id:$release_id,release_url:$release_url}}')
          printf '%s' "$payload" | gh api \
            --method POST \
            /repos/RyanMorrisroe/SportsScoreboard-Native/dispatches \
            --input -
