name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Package static site
        run: zip -r "sports-scoreboard-${GITHUB_REF_NAME}.zip" dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "sports-scoreboard-${GITHUB_REF_NAME}.zip" \
            --generate-notes \
            --title "Sports Scoreboard ${GITHUB_REF_NAME}"
