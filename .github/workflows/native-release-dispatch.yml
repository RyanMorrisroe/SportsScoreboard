name: Dispatch Native Wrapper Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate SPA release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable SPA version tag like v1.2.3; received $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Create wrapper dispatch token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.NATIVE_WRAPPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.NATIVE_WRAPPER_APP_PRIVATE_KEY }}
          owner: RyanMorrisroe
          repositories: SportsScoreboard-Native
          permission-contents: write

      - name: Dispatch published SPA release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          payload=$(jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg version "${RELEASE_TAG#v}" \
            --arg sha "$RELEASE_SHA" \
            --arg release_id "$RELEASE_ID" \
            --arg release_url "$RELEASE_URL" \
            '{event_type:"sports-scoreboard-release",client_payload:{tag:$tag,version:$version,sha:$sha,release_id:$release_id,release_url:$release_url}}')
          printf '%s' "$payload" | gh api \
            --method POST \
            /repos/RyanMorrisroe/SportsScoreboard-Native/dispatches \
            --input -
